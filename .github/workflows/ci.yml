# Continuous integration (DESIGN.md §39).
#
# The SIMD kernels are behind `//go:build goexperiment.simd && amd64` (AVX2)
# and `goexperiment.simd && arm64` (NEON), so a default build never
# compiles, tests or lints them. Everything that can see them therefore
# runs in both build configurations, and the SIMD one on both
# architectures.
#
# Two tiers. Pushes to master and pull requests get the quick one: every
# test once in each build and on each SIMD backend, lint in every
# configuration, and the race detector on the packages that start
# goroutines. A release tag (v*), or a manual run, gets the full one: the
# scalar build on Linux, Windows and macOS, the race detector over
# everything in every build, and the cog adapter's race run and fuzzing.

name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch supersedes the run in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FULL: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  test:
    # Quick: the scalar build on Linux, and the SIMD build on each backend,
    # AVX2 on the amd64 runner and NEON on the arm64 macOS one. The macOS
    # entry also covers arm64's multiply-add fusion (DESIGN.md §39,
    # Determinism), which amd64 never exercises. Full adds the scalar
    # build on Windows and macOS, for the platform-specific files in the
    # benchmark suite (cores_*.go, memory_*.go).
    #
    # Kernels dispatch at runtime, so on an amd64 runner without AVX2 the
    # SIMD entry falls back to scalar and its agreement tests are vacuous
    # rather than failing. NEON is baseline on arm64, so there it always
    # runs.
    name: test (${{ matrix.goexperiment || 'default' }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '[{"os":"ubuntu-latest","goexperiment":""},{"os":"windows-latest","goexperiment":""},{"os":"macos-latest","goexperiment":""},{"os":"ubuntu-latest","goexperiment":"simd"},{"os":"macos-latest","goexperiment":"simd"}]' || '[{"os":"ubuntu-latest","goexperiment":""},{"os":"ubuntu-latest","goexperiment":"simd"},{"os":"macos-latest","goexperiment":"simd"}]') }}
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  race:
    # internal/exec is the only package that starts goroutines; its tests
    # and engine's also fail on a leaked goroutine (goleak). Quick runs
    # just those two, in the default build. Full runs everything in both
    # builds and on both SIMD backends, since the kernels run under those
    # workers.
    name: race (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '[{"name":"default","os":"ubuntu-latest","goexperiment":""},{"name":"simd","os":"ubuntu-latest","goexperiment":"simd"},{"name":"simd-arm64","os":"macos-latest","goexperiment":"simd"}]' || '[{"name":"default","os":"ubuntu-latest","goexperiment":""}]') }}
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race (goroutine packages)
        if: env.FULL != 'true'
        run: go test -race ./internal/exec/... ./engine/...
      - name: Race (everything)
        if: env.FULL == 'true'
        run: go test -race ./...

  lint:
    # golangci-lint must be built with a Go version at least this module's
    # or it cannot load the packages, refusing with "the Go language
    # version used to build golangci-lint is lower than the targeted Go
    # version" (.golangci.yml). So it is installed from source here rather
    # than taken as a prebuilt binary: setup-go has already put the version
    # from go.mod on PATH, and `go install` builds it with that. Do not pin
    # GOTOOLCHAIN to a literal version — it would force an older toolchain
    # than go.mod targets the next time go.mod is bumped. The version of
    # golangci-lint itself is pinned to the one .golangci.yml documents.
    # The NEON files only exist for GOARCH=arm64, so one entry lints the
    # SIMD build cross-compiled for it.
    name: lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            goexperiment: ""
            goarch: ""
          - name: simd
            goexperiment: simd
            goarch: ""
          - name: simd-arm64
            goexperiment: simd
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # kernelborder (lint/, its own module) keeps kernel packages
      # span-level and SIMD inside them (DESIGN.md §12, §14). It runs as a
      # vet tool, in this job's build configuration, because the SIMD
      # kernels only compile with GOEXPERIMENT=simd.
      - name: Test kernelborder
        working-directory: lint
        run: go test ./...
      - name: Build kernelborder
        working-directory: lint
        run: go build -o "$RUNNER_TEMP/kernelborder" ./cmd/kernelborder
      - name: Run kernelborder
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet -vettool="$RUNNER_TEMP/kernelborder" ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Check it was built with the module's Go version
        run: golangci-lint --version
      - name: Run golangci-lint
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}
          GOARCH: ${{ matrix.goarch }}
        run: golangci-lint run ./...

  cog:
    # The GeoTIFF/COG adapter is its own module (docs/adr/0002-cog-adapter.md),
    # so the jobs above, which run in the root module, never see it. Its
    # row kernels (cog/internal/kern) have AVX2 and NEON forms in
    # GOEXPERIMENT=simd builds, so the SIMD build is tested on Linux (AVX2)
    # and on the arm64 macOS runner (NEON), and vetted (kernelborder
    # included) and linted for both architectures on Linux. Its
    # correctness against GDAL is judged by acceptance/cogcheck.sh, which
    # needs Docker and is run by hand, like the other GDAL checks.
    #
    # Quick is build, vet, test and lint on Linux, and the tests on macOS.
    # Full adds Windows, the race detector (about seven minutes) and a
    # minute each of fuzzing Open and the row kernels.
    name: cog (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    defaults:
      run:
        working-directory: cog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cog/go.mod
          cache-dependency-path: cog/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Test the SIMD build
        if: matrix.os != 'windows-latest'
        env:
          GOEXPERIMENT: simd
        run: go test ./...
      - name: Run kernelborder on every build
        if: matrix.os == 'ubuntu-latest'
        run: |
          (cd ../lint && go build -o "$RUNNER_TEMP/kernelborder" ./cmd/kernelborder)
          go vet -vettool="$RUNNER_TEMP/kernelborder" ./...
          GOEXPERIMENT=simd go vet -vettool="$RUNNER_TEMP/kernelborder" ./...
          GOEXPERIMENT=simd GOARCH=arm64 go vet -vettool="$RUNNER_TEMP/kernelborder" ./...
      - name: Race
        if: env.FULL == 'true' && matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: Fuzz Open briefly
        if: env.FULL == 'true' && matrix.os == 'ubuntu-latest'
        run: go test -run='^$' -fuzz=FuzzOpen -fuzztime=60s .
      - name: Fuzz the SIMD row kernels against the scalar ones briefly
        if: env.FULL == 'true' && matrix.os != 'windows-latest'
        env:
          GOEXPERIMENT: simd
        run: go test -run='^$' -fuzz=FuzzKernels -fuzztime=60s ./internal/kern
      - name: Install golangci-lint
        if: matrix.os == 'ubuntu-latest'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Run golangci-lint
        if: matrix.os == 'ubuntu-latest'
        run: golangci-lint run --config ../.golangci.yml ./...
      - name: Run golangci-lint on the SIMD build
        if: matrix.os == 'ubuntu-latest'
        env:
          GOEXPERIMENT: simd
        run: golangci-lint run --config ../.golangci.yml ./...
      - name: Run golangci-lint on the arm64 SIMD build
        if: matrix.os == 'ubuntu-latest'
        env:
          GOEXPERIMENT: simd
          GOARCH: arm64
        run: golangci-lint run --config ../.golangci.yml ./...
