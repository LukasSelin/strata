# Continuous integration (DESIGN.md §39).
#
# The SIMD kernels are behind `//go:build goexperiment.simd && amd64` (AVX2)
# and `goexperiment.simd && arm64` (NEON), so a default build never
# compiles, tests or lints them. Everything that can see them therefore
# runs in both build configurations, and the SIMD one on both
# architectures.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch supersedes the run in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The scalar path, on each OS with platform-specific files in the
    # benchmark suite (cores_*.go, memory_*.go). Without the experiment,
    # every architecture runs scalar.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  test-simd:
    # The vector path: AVX2 on the amd64 runner, NEON on the arm64 macOS
    # runner. Kernels dispatch at runtime, so this job proves the SIMD
    # build compiles and its bit-for-bit agreement tests pass; on an amd64
    # runner without AVX2 the dispatch falls back to scalar and the
    # comparison is vacuous rather than failing. NEON is baseline on arm64,
    # so there it always runs.
    name: test (simd, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  race:
    # internal/exec is the only package that starts goroutines; its tests
    # and engine's also fail on a leaked goroutine (goleak). Both builds,
    # and both SIMD backends, since the kernels run under those workers.
    name: race (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            os: ubuntu-latest
            goexperiment: ""
          - name: simd
            os: ubuntu-latest
            goexperiment: simd
          - name: simd-arm64
            os: macos-latest
            goexperiment: simd
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  lint:
    # golangci-lint must be built with a Go version at least this module's
    # or it cannot load the packages, refusing with "the Go language
    # version used to build golangci-lint is lower than the targeted Go
    # version" (.golangci.yml). So it is installed from source here rather
    # than taken as a prebuilt binary: setup-go has already put the version
    # from go.mod on PATH, and `go install` builds it with that. Do not pin
    # GOTOOLCHAIN to a literal version — it would force an older toolchain
    # than go.mod targets the next time go.mod is bumped. The version of
    # golangci-lint itself is pinned to the one .golangci.yml documents.
    # The NEON files only exist for GOARCH=arm64, so one entry lints the
    # SIMD build cross-compiled for it.
    name: lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            goexperiment: ""
            goarch: ""
          - name: simd
            goexperiment: simd
            goarch: ""
          - name: simd-arm64
            goexperiment: simd
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # kernelborder (lint/, its own module) keeps kernel packages
      # span-level and SIMD inside them (DESIGN.md §12, §14). It runs as a
      # vet tool, in this job's build configuration, because the SIMD
      # kernels only compile with GOEXPERIMENT=simd.
      - name: Test kernelborder
        working-directory: lint
        run: go test ./...
      - name: Build kernelborder
        working-directory: lint
        run: go build -o "$RUNNER_TEMP/kernelborder" ./cmd/kernelborder
      - name: Run kernelborder
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet -vettool="$RUNNER_TEMP/kernelborder" ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Check it was built with the module's Go version
        run: golangci-lint --version
      - name: Run golangci-lint
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}
          GOARCH: ${{ matrix.goarch }}
        run: golangci-lint run ./...

  cog:
    # The GeoTIFF/COG adapter is its own module (docs/adr/0002-cog-adapter.md),
    # so the jobs above, which run in the root module, never see it. It
    # has no SIMD code, so the default build is the only one. Its
    # correctness against GDAL is judged by acceptance/cogcheck.sh, which
    # needs Docker and is run by hand, like the other GDAL checks.
    name: cog (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: cog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cog/go.mod
          cache-dependency-path: cog/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Race
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: Fuzz Open briefly
        if: matrix.os == 'ubuntu-latest'
        run: go test -run='^$' -fuzz=FuzzOpen -fuzztime=60s .
      - name: Install golangci-lint
        if: matrix.os == 'ubuntu-latest'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Run golangci-lint
        if: matrix.os == 'ubuntu-latest'
        run: golangci-lint run --config ../.golangci.yml ./...
