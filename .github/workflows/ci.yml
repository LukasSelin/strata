# Continuous integration (DESIGN.md §39).
#
# The SIMD kernels are behind `//go:build goexperiment.simd && amd64`, so a
# default build never compiles, tests or lints them. Everything that can
# see them therefore runs twice, once per build configuration.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch supersedes the run in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The scalar path, on each OS with platform-specific files in the
    # benchmark suite (cores_*.go, memory_*.go). macOS runners are arm64,
    # which runs the scalar kernels until STRATA-11.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  test-simd:
    # The vector path. Kernels dispatch at runtime, so this job proves the
    # SIMD build compiles and its bit-for-bit agreement tests pass; on a
    # runner without AVX2 the dispatch falls back to scalar and the
    # comparison is vacuous rather than failing.
    name: test (simd)
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  race:
    # internal/exec is the only package that starts goroutines; its tests
    # and engine's also fail on a leaked goroutine (goleak). Both builds,
    # since the kernels run under those workers.
    name: race (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            goexperiment: ""
          - name: simd
            goexperiment: simd
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  lint:
    # golangci-lint must be built with a Go version at least this module's
    # or it cannot load the packages, refusing with "the Go language
    # version used to build golangci-lint is lower than the targeted Go
    # version" (.golangci.yml). So it is installed from source here rather
    # than taken as a prebuilt binary: setup-go has already put the version
    # from go.mod on PATH, and `go install` builds it with that. Do not pin
    # GOTOOLCHAIN to a literal version — it would force an older toolchain
    # than go.mod targets the next time go.mod is bumped. The version of
    # golangci-lint itself is pinned to the one .golangci.yml documents.
    name: lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            goexperiment: ""
          - name: simd
            goexperiment: simd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Check it was built with the module's Go version
        run: golangci-lint --version
      - name: Run golangci-lint
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}
        run: golangci-lint run ./...
